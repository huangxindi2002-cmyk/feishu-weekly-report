name: 部署 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "reports/**"
      - ".nojekyll"
      - ".github/workflows/pages_deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Pages 静态文件
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R reports _site/reports
          touch _site/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
